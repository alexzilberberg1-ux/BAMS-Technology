# Fly.io config for the BAMS Practice Assistant demo deployment.
# Deploy steps: see DEPLOY.md (fly launch is NOT needed — this file is the config).
app = "bams-practice-assistant"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
